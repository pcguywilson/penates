<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penates QA Bench</title>
<style>
  :root{--bg:#0f1420;--card:#171e2e;--line:#28324a;--ink:#e6ebf5;--dim:#8a97b0;--accent:#4f7cff;
        --ok:#1f9d55;--warn:#c9821a;--bad:#d1495b;--chip:#202a40}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
  .muted{color:var(--dim);font-size:12.5px}
  main{max-width:1000px;margin:0 auto;padding:18px 20px 60px}
  .ctx{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
  .ctx label{display:flex;flex-direction:column;font-size:11px;color:var(--dim);gap:3px;flex:1;min-width:150px}
  input[type=text],textarea{background:var(--card);border:1px solid var(--line);color:var(--ink);
        border-radius:7px;padding:8px 10px;font:inherit}
  textarea{width:100%;min-height:52px;resize:vertical}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
  button{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;
        font-weight:600;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
  button.sm{padding:4px 9px;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
  .q .top{display:flex;gap:10px;align-items:flex-start}
  .q .top textarea{flex:1}
  .q .actions{display:flex;flex-direction:column;gap:6px}
  .res{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none}
  .res.show{display:block}
  .ans{white-space:pre-wrap;background:#0c111b;border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin:8px 0 0}
  .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:11.5px;color:var(--dim)}
  .flag{border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .flag.ok{background:rgba(31,157,85,.15);color:#57d38a;border:1px solid rgba(31,157,85,.4)}
  .flag.warn{background:rgba(201,130,26,.15);color:#e2a94e;border:1px solid rgba(201,130,26,.4)}
  .flag.bad{background:rgba(209,73,91,.15);color:#f07d8d;border:1px solid rgba(209,73,91,.4)}
  .spin{color:var(--dim);font-size:12.5px}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Penates QA Bench</h1>
  <span class="muted">Add questions the model hasn't seen, run them against the live engine, spot the flaws. Nothing is submitted anywhere.</span>
</header>
<main>
  <div class="ctx">
    <label>Company<input id="company" type="text" value="1Password"></label>
    <label>Role<input id="role" type="text" value="Senior IT Engineer"></label>
    <label>Posting URL (for grounding)<input id="url" type="text" value="https://jobs.ashbyhq.com/1password/df6afe6a-7e62-4d57-be23-22583d0cdeb9/application"></label>
  </div>
  <div class="bar">
    <button id="add" class="ghost">+ Add question</button>
    <button id="runall">Run all</button>
    <button id="save" class="ghost">Save list</button>
    <label class="muted" style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="fresh"> fresh (bypass cache)</label>
    <span id="status" class="muted" style="margin-left:auto"></span>
  </div>
  <div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const listEl = $("#list");
const FLUFF = /\baligns?\s+(perfectly|seamlessly)\b|\bpassion(ate)?\b|\bseamless\b|\bsynergy\b|\bleverage\s+my\b|\bthrive\b|\bbest\s+practices\b|\bhit\s+the\s+ground\s+running\b|\bwell[- ]equipped\b|\bcutting[- ]edge\b/i;

const DEFAULTS = [
  "Why 1Password? There are a lot of great companies out there. What makes you excited to work at 1Password?",
  "In three to four sentences describe the most complex endpoint management or device automation project you personally owned.",
  "Tell us about a time you had to influence a team that disagreed with you.",
  "What would you build if you had a month of uninterrupted engineering time?",
  "Describe your experience with Kubernetes.",
  "What does reliability mean to you?"
];

function ctx(){ return {company:$("#company").value.trim(), role:$("#role").value.trim(), url:$("#url").value.trim(), fresh:$("#fresh").checked}; }

function isWhyCompany(q){ return /\bwhy\b|excited|what makes you|want to (work|join)|interested in (working|joining)|draws you/i.test(q||""); }
function isEssayShaped(q){ return isWhyCompany(q) || /tell (us|me) about|describe (a|the|your)|most (complex|challenging)|you (personally )?(owned|led|built)|walk (us|me) through|example of/i.test(q||""); }

function flags(d, q, company){
  const out=[]; const t=(d.text||"");
  if(d.__error) return [["bad","ERROR: "+d.__error]];
  if(t.trim().length<40) out.push(["bad","SHORT/EMPTY"]);
  // NO-COMPANY: a why-company answer that never names the company (guards the B-floor regression)
  if(isWhyCompany(q) && company && t.toLowerCase().indexOf(company.toLowerCase())<0) out.push(["bad","NO-COMPANY (never names "+company+")"]);
  if(d.method==="essay-skip" && isEssayShaped(q)) out.push(["warn","SKIPPED (essay not drafted)"]);
  if(d.review) out.push(["warn","REVIEW"]);
  if(d.gaps && d.gaps.length) out.push(["warn","GAP: "+d.gaps.join(", ")]);
  if(d.method==="learned"||d.method==="imported") out.push(["warn","CACHED ("+d.method+"), not live engine"]);
  if(d.checks && d.checks.length) out.push(["warn","checks: "+d.checks.join(" / ")]);
  if(t.indexOf("—")>=0 || t.indexOf("–")>=0 || /\s-\s/.test(t)) out.push(["bad","EM-DASH"]);
  if(FLUFF.test(t)) out.push(["bad","FLUFF"]);
  if(out.length===0) out.push(["ok","OK"]);
  return out;
}

// one-previous-run memory (localStorage) so the bench chips regressions when the engine changes
function runKey(c,q){ return "qa:"+((c.company||"")+"|"+(c.role||"")+"|"+(q||"").toLowerCase().replace(/\s+/g," ").trim()); }
function prevRun(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function saveRun(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function diffChip(prev, text, isBad){
  if(!prev) return "";
  if(prev.text===text) return "";                       // unchanged
  if(!prev.bad && isBad)  return '<span class="flag bad">REGRESSED</span>';
  if(prev.bad && !isBad)  return '<span class="flag ok">IMPROVED</span>';
  return '<span class="flag warn">CHANGED</span>';
}

function render(questions){
  listEl.innerHTML="";
  questions.forEach((q,i)=>{
    const card=document.createElement("div"); card.className="q";
    card.innerHTML=`<div class="top">
        <textarea data-i="${i}" placeholder="Type a question...">${(q||"").replace(/</g,"&lt;")}</textarea>
        <div class="actions">
          <button class="sm ask">Ask</button>
          <button class="sm ghost del">Delete</button>
        </div></div>
      <div class="res"><div class="meta"></div><div class="ans"></div></div>`;
    listEl.appendChild(card);
    const ta=card.querySelector("textarea");
    card.querySelector(".del").onclick=()=>{ card.remove(); };
    card.querySelector(".ask").onclick=()=>ask(card, ta.value.trim());
  });
}
function currentQuestions(){ return [...listEl.querySelectorAll("textarea")].map(t=>t.value.trim()).filter(Boolean); }

async function ask(card, q){
  if(!q) return;
  const res=card.querySelector(".res"); const meta=card.querySelector(".meta"); const ans=card.querySelector(".ans");
  res.classList.add("show"); meta.innerHTML='<span class="spin">running...</span>'; ans.textContent="";
  const c=ctx(); const t0=performance.now();
  let d;
  try{
    d=await fetch("/answer",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q,company:c.company,role:c.role,url:c.url,fresh:c.fresh})}).then(r=>r.json());
  }catch(e){ d={__error:String(e)}; }
  const ms=Math.round(performance.now()-t0);
  const chips=[`<span class="chip">${d.method||"?"}</span>`,`<span class="chip">${ms} ms</span>`];
  if(d.grounding) chips.push(`<span class="chip">grounding: ${d.grounding}</span>`);
  if(d.story) chips.push(`<span class="chip">story: ${d.story}</span>`);
  const flArr=flags(d, q, c.company);
  const isBad=flArr.some(([k])=>k==="bad");
  const key=runKey(c,q); const prev=prevRun(key);
  const dc=diffChip(prev, d.text||"", isBad);
  saveRun(key,{text:d.text||"", bad:isBad});
  const fl=flArr.map(([k,v])=>`<span class="flag ${k}">${v}</span>`).join("");
  meta.innerHTML=chips.join("")+" "+fl+(dc?" "+dc:"");
  ans.textContent=d.text||d.__error||"(no text)";
}

async function runAll(){
  const qs=currentQuestions(); if(!qs.length) return;
  $("#status").textContent="running "+qs.length+"...";
  const cards=[...listEl.querySelectorAll(".q")];
  for(const card of cards){
    const q=card.querySelector("textarea").value.trim();
    if(q) await ask(card,q);
  }
  $("#status").textContent="done";
}

async function load(){
  try{
    const d=await fetch("/qa/questions").then(r=>r.json());
    render((d.questions&&d.questions.length)?d.questions:DEFAULTS);
  }catch(e){ render(DEFAULTS); }
}
async function save(){
  const qs=currentQuestions();
  $("#status").textContent="saving...";
  try{
    const r=await fetch("/qa/questions",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({questions:qs})}).then(r=>r.json());
    $("#status").textContent = r.ok ? ("saved "+r.count) : ("save failed: "+(r.error||"?"));
  }catch(e){ $("#status").textContent="save failed"; }
}

$("#add").onclick=()=>{ const qs=currentQuestions(); qs.push(""); render(qs);
  const tas=listEl.querySelectorAll("textarea"); tas[tas.length-1].focus(); };
$("#runall").onclick=runAll;
$("#save").onclick=save;
load();
</script>
</body>
</html>
